<header class="navbar">
  <div class="navbar__inner container">
    <a class="navbar__brand" routerLink="/home" aria-label="MeteoLab, retour a l'accueil">
      <span class="navbar__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M6.6 18a4.6 4.6 0 0 1-.5-9.17 6 6 0 0 1 11.42-1.2A4.4 4.4 0 0 1 17.9 18Z" />
        </svg>
      </span>
      <span class="navbar__name">Meteo<span class="navbar__name-accent">Lab</span></span>
    </a>

    <button
      class="navbar__burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="navbar-menu"
      aria-label="Ouvrir le menu de navigation"
    >
      <span class="navbar__burger-bar" aria-hidden="true"></span>
      <span class="navbar__burger-bar" aria-hidden="true"></span>
      <span class="navbar__burger-bar" aria-hidden="true"></span>
    </button>

    <nav id="navbar-menu" class="navbar__menu" [class.navbar__menu--open]="menuOpen()">
      <ul class="navbar__links">
        @for (link of links; track link.path) {
          <li>
            <a
              class="navbar__link"
              [routerLink]="link.path"
              routerLinkActive="navbar__link--active"
              [routerLinkActiveOptions]="{ exact: false }"
              ariaCurrentWhenActive="page"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <button
        class="navbar__theme"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="
          theme() === 'dark' ? 'Activer le theme clair' : 'Activer le theme sombre'
        "
        [title]="theme() === 'dark' ? 'Theme clair' : 'Theme sombre'"
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path
              d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-14a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1Zm0 15.5a1 1 0 0 1 1 1V21a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1ZM3 12a1 1 0 0 1 1-1h1.5a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1Zm15.5 0a1 1 0 0 1 1-1H21a1 1 0 1 1 0 2h-1.5a1 1 0 0 1-1-1ZM5.6 5.6a1 1 0 0 1 1.42 0l1.06 1.06A1 1 0 0 1 6.66 8.1L5.6 7.02a1 1 0 0 1 0-1.42Zm10.32 10.32a1 1 0 0 1 1.42 0l1.06 1.06a1 1 0 0 1-1.42 1.42l-1.06-1.06a1 1 0 0 1 0-1.42Zm2.48-10.32a1 1 0 0 1 0 1.42L17.34 8.1a1 1 0 0 1-1.42-1.42l1.06-1.06a1 1 0 0 1 1.42 0ZM8.08 15.92a1 1 0 0 1 0 1.42L7.02 18.4A1 1 0 0 1 5.6 16.98l1.06-1.06a1 1 0 0 1 1.42 0Z"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M21 13.2A9 9 0 0 1 10.8 3a9 9 0 1 0 10.2 10.2Z" />
          </svg>
        }
      </button>
    </nav>
  </div>
</header>
